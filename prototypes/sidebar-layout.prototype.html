const render = { A: VariantA, B: VariantB, C: VariantC, D: VariantD, E: VariantE, F: VariantF, G: VariantG, H: VariantH, I: VariantI, J: VariantJ };

/* ===================== rendering ===================== */
const panel = document.getElementById("panel");

function applyTheme() {
  const t = themes[state.theme], s = state.textScale;
  for (const p of THEME_VARS) panel.style.removeProperty("--" + p);
  for (const [k, v] of Object.entries(t.v)) panel.style.setProperty("--" + k, v);
  const f = fonts[state.fontOverride || t.font];
  panel.style.setProperty("--font", f.family);
  panel.style.setProperty("--fw", f.fw);
  panel.style.setProperty("--fs", (f.fs * s).toFixed(1) + "px");
  const lh = Math.round(24 * s), fs = f.fs * s;
  panel.style.setProperty("--lh", lh + "px");     // line spacing grows with the text, so ruled lines still fit
  panel.style.setProperty("--mono", (12 * s).toFixed(1) + "px");
  // Move the ruled lines up so the writing SITS on them, like on paper: the line goes just under the
  // letters' baseline instead of at the very bottom of each row (where the text seemed to float above it).
  const baseline = (lh - fs) / 2 + .78 * fs;
  panel.style.setProperty("--line-shift", Math.round(baseline + 2 - (lh - 1)) + "px");
  panel.classList.toggle("inside", state.inside);
}

// Keep the line grid intact below drawings: a sketch block's height isn't a whole number of rows,
// so pad it to the next full row — otherwise every line after it slips off the ruling.
function snapToGrid() {
  if (typeof getComputedStyle !== "function") return;
  const lh = parseFloat(getComputedStyle(panel).getPropertyValue("--lh")) || 24;
  panel.querySelectorAll(".sk").forEach(el => {
    el.style.marginBottom = "0px";
    const h = el.getBoundingClientRect().height;
    el.style.marginBottom = (Math.ceil(h / lh) * lh - h + lh) + "px";
  });
}

function renderAll() {
  const active = document.activeElement;
  const focusId = active && panel.contains(active) ? active.id : null;
  const sel = focusId && "selectionStart" in active ? [active.selectionStart, active.selectionEnd] : null;
  const side = panel.querySelector(".g-side");
  const sideScroll = side ? side.scrollTop : 0;

  applyTheme();
  panel.dataset.variant = state.variant;
  panel.classList.toggle("with-settings", state.settings);
  panel.innerHTML = `${state.settings ? settingsHtml() : ""}${cheatHtml()}<div class="shell">
    <div class="main">
      ${render[state.variant]()}
      ${state.toast ? `<div class="toast">${esc(state.toast)}</div>` : ""}
      <button class="g-fab ${state.settings ? "open" : ""}" data-action="settings" title="Glacier settings">${GLACIER_ICON}</button>
      ${firstSyncHtml()}
    </div></div>`;
  state.settingsAnim = false;
  if (state.settings) panel.querySelector(".g-side").scrollTop = sideScroll;
  snapToGrid();

  const ed = document.getElementById("blk-ed");
  if (ed) growEd(ed);
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) { el.focus(); if (sel && el.setSelectionRange) el.setSelectionRange(...sel); }
  }
}

function renderCourse() {
  const p = pages[state.page];
  document.getElementById("url").textContent = "https://www." + p.url;
  document.getElementById("lesson").innerHTML =
    `<div class="site">${p.site}</div><h1>${esc(p.title)}</h1>${p.text.map(t => `<p>${esc(t)}</p>`).join("")}`;
}

/* ===================== actions ===================== */
// put the cursor in the search box of whichever panel just opened
function focusQ() { const q = document.getElementById("q"); if (q) q.focus(); }

function open(title) {
  if (!notes[title]) notes[title] = { type: "concept", updated: 0, body: "" };
  state.current = title;
  state.drawer = false; state.palette = false; state.query = ""; state.hi = 0;
  state.tab = "note"; state.view = "note";
  state.etab = null; state.home = false; state.gpicker = false; state.hmenu = false; state.hlinks = false; state.rail = null;
  loadBlocks();
  renderAll();
  if (!state.firstSync) activate(state.active, null);
}
function newLesson() {
  const p = pages[state.page];
  let title = p.suggest;
  if (notes[title]) title = `${title} (${shortCourse(state.lastCourse)})`;
  notes[title] = { type: "lesson", course: state.lastCourse, source: p.url, updated: 0, body: "" };
  open(title);
}
function newConcept() {
  let i = 1; while (notes["Untitled concept " + i]) i++;
  open("Untitled concept " + i);
}

// "+" button: open the insert menu on this line if it's empty, otherwise on a new line below it.
function plusInsert() {
  const i = state.active;
  if (i == null) return;
  if (state.blocks[i].trim() !== "") { state.blocks.splice(i + 1, 0, ""); saveBlocks(); activate(i + 1, 0); }
  const ed = document.getElementById("blk-ed");
  ed.value = "/"; state.blocks[state.active] = "/"; ed.setSelectionRange(1, 1); ed.focus();
  updateSlash(ed);
}

panel.addEventListener("mousedown", e => {
  if (e.target.closest(".ed-plus")) { e.preventDefault(); return plusInsert(); }
  const cmd = e.target.closest("[data-cmd]");
  if (cmd) { e.preventDefault(); return applyCommand(slash.items[+cmd.dataset.cmd]); }
  // Note text is NOT switched into editing on press any more: the browser can then drag-select across
  // several paragraphs. A plain click (press + release without dragging) starts editing — see mouseup.
});
panel.addEventListener("mouseup", e => {
  if (e.button !== 0 || e.target.closest("[data-open], .sk, .ed-plus, [data-cmd], #blk-ed, .slash")) return;
  const sel = window.getSelection && getSelection();
  if (sel && !sel.isCollapsed && panel.contains(sel.anchorNode)) return;   // you selected text: leave it, so you can copy it
  const b = e.target.closest(".blk[data-i]");
  if (b) { sk.name = null; return activate(+b.dataset.i, rawOffsetFromPoint(e.clientX, e.clientY)); }
  if (e.target.matches(".blocks, .sheet") && document.getElementById("blocks")) activate(state.blocks.length - 1, null);
});

/* ----- selecting and copying several paragraphs ----- */
// Ctrl+A once selects the line you're on; Ctrl+A again selects the whole note (not the whole web page).
function selectWholeNote() {
  activate(null);                                     // show every line rendered, so it can all be selected
  const box = document.getElementById("blocks");
  if (!box) return;
  const r = document.createRange(); r.selectNodeContents(box);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
}
// Map a point in the rendered note back to [block index, offset in that block's raw Markdown].
function rawPos(node, offset, atEnd) {
  const el = node.nodeType === 3 ? node.parentElement : node;
  const blk = el.closest && el.closest("[data-i]");
  if (!blk) return null;
  const i = +blk.dataset.i, raw = state.blocks[i], host = node.nodeType === 3 && el.closest("[data-r]");
  if (isSketch(raw) || isCode(raw) || !host) return [i, atEnd ? raw.length : 0];
  return [i, Math.min(raw.length, +host.dataset.r + offset)];
}
// Copying keeps the Markdown (headings, lists, [[links]], code), so it pastes back into a note — or Obsidian — intact.
document.addEventListener("copy", e => {
  const sel = getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return;
  const box = document.getElementById("blocks"), r = sel.getRangeAt(0);
  if (!box || !box.contains(r.commonAncestorContainer) && r.commonAncestorContainer !== box) return;
  let a = rawPos(r.startContainer, r.startOffset, false), b = rawPos(r.endContainer, r.endOffset, true);
  if (r.startContainer === box || !a) a = [0, 0];
  if (r.endContainer === box || !b) { const last = state.blocks.length - 1; b = [last, state.blocks[last].length]; }
  const lines = state.blocks.slice(a[0], b[0] + 1);
  if (lines.length === 1) lines[0] = lines[0].slice(a[1], b[1]);
  else { lines[0] = lines[0].slice(a[1]); lines[lines.length - 1] = lines[lines.length - 1].slice(0, b[1]); }
  const div = document.createElement("div"); div.appendChild(r.cloneContents());
  e.clipboardData.setData("text/plain", lines.join("\n"));
  e.clipboardData.setData("text/html", div.innerHTML);
  e.preventDefault();
  showToast(`Copied ${lines.length} line${lines.length > 1 ? "s" : ""} as Markdown`);
});

panel.addEventListener("click", e => {
  const kp = e.target.closest("[data-keep]");                       // ☆ Keep on a layout card
  if (kp) { const k = kp.dataset.keep; state.keep.has(k) ? state.keep.delete(k) : state.keep.add(k); return renderAll(); }
  const ct = e.target.closest("[data-close-tab]");                 // × on a note tab (layout G)
  if (ct) { const t = ct.dataset.closeTab; state.tabs = state.tabs.filter(x => x !== t); if (t === state.current && state.tabs.length) return open(state.tabs[state.tabs.length - 1]); return renderAll(); }
  const o = e.target.closest("[data-open]");
  if (o) { e.preventDefault(); return open(o.dataset.open); }
  const tab = e.target.closest("[data-tab]");
  if (tab) { state.tab = tab.dataset.tab; return renderAll(); }
  const th = e.target.closest("[data-pick-theme]");
  if (th) { state.theme = th.dataset.pickTheme; return renderAll(); }
  const fo = e.target.closest("[data-pick-font]");
  if (fo) { state.fontOverride = fo.dataset.pickFont; return renderAll(); }
  const la = e.target.closest("[data-pick-layout]");
  if (la) return setVariant(la.dataset.pickLayout);
  const a = e.target.closest("[data-action]");
  if (!a) return;
  switch (a.dataset.action) {
    case "cycle-sync": state.sync = (state.sync + 1) % syncStates.length; break;
    case "sync-now": return syncNow();
    case "first-sync": return runFirstSync();
    case "drawer": state.drawer = !state.drawer; state.query = ""; break;
    case "new-lesson": return newLesson();
    case "new-concept": return newConcept();
    case "crumb": state.view = a.dataset.to; state.course = a.dataset.course; break;
    case "palette": state.palette = true; state.query = ""; state.hi = 0; renderAll(); document.getElementById("pq").focus(); return;
    case "palette-close": if (e.target !== a) return; state.palette = false; break;
    case "etab": state.etab = a.dataset.val && state.etab !== a.dataset.val ? a.dataset.val : null; state.query = ""; renderAll(); return focusQ();
    case "home": state.home = true; state.query = ""; break;
    case "fcourse": state.fcourse = state.fcourse === a.dataset.val ? null : a.dataset.val; break;
    case "gpicker": state.gpicker = !state.gpicker; state.query = ""; renderAll(); return focusQ();
    case "hmenu": state.hmenu = !state.hmenu; state.hlinks = false; state.query = ""; renderAll(); return focusQ();
    case "hlinks": state.hlinks = !state.hlinks; state.hmenu = false; break;
    case "rail": state.rail = a.dataset.val && state.rail !== a.dataset.val ? a.dataset.val : null; state.query = ""; renderAll(); return focusQ();
    case "settings": state.settings = !state.settings; state.settingsAnim = state.settings; if (state.inside && state.settings) state.cheat.collapsed = true; break;
    case "inside": state.inside = !state.inside; break;
    case "settings-close": state.settings = false; break;
    case "sec": state.sections[a.dataset.sec] = !state.sections[a.dataset.sec]; break;
    case "theme-group": state.themeGroup = a.dataset.val; break;
    case "ts-reset": state.textScale = 1; break;
    case "cheat-toggle": state.cheat.on = !state.cheat.on; state.cheat.collapsed = false; break;
    case "cheat-collapse": state.cheat.collapsed = !state.cheat.collapsed; if (state.inside && !state.cheat.collapsed) state.settings = false; break;
    case "cheat-off": state.cheat.on = false; break;
  }
  renderAll();
});

panel.addEventListener("keydown", e => { if (e.target.id === "blk-ed") onEditorKey(e); });

panel.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "blk-ed") return onEditorInput(t);
  if (t.id === "ts") {                      // live text size without re-rendering (so the slider keeps dragging)
    state.textScale = +t.value; applyTheme(); snapToGrid();
    document.getElementById("ts-val").textContent = Math.round(state.textScale * 100) + "%";
    const ed = document.getElementById("blk-ed"); if (ed) growEd(ed);
    return;
  }
  if (t.id === "q" || t.id === "pq") { state.query = t.value; state.hi = 0; return renderAll(); }
  if (t.id === "filter") { state.filter = t.value; return renderAll(); }
});
panel.addEventListener("change", e => { if (e.target.id === "ts") renderAll(); });

function setVariant(v) {
  state.variant = v; state.drawer = false; state.palette = false; state.query = "";
  state.etab = null; state.home = false; state.gpicker = false; state.hmenu = false; state.hlinks = false; state.rail = null;
  const url = new URL(location.href); url.searchParams.set("variant", v);
  history.replaceState(null, "", url);
  renderAll();
}

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {   // "find a note" in every layout
    e.preventDefault(); e.stopPropagation();
    state.query = ""; state.hi = 0;
    if (state.variant === "A") state.drawer = true;
    if (state.variant === "B") state.tab = "search";
    if (state.variant === "C" || state.variant === "J") state.palette = true;
    if (state.variant === "E") state.etab = "search";
    if (state.variant === "F") state.home = true;
    if (state.variant === "G") state.gpicker = true;
    if (state.variant === "H") state.hmenu = true;
    if (state.variant === "I") state.rail = "search";
    renderAll(); document.getElementById({ C: "pq", J: "pq", D: "filter" }[state.variant] || "q").focus(); return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "a" && !(e.target.closest && e.target.closest("input, textarea")) && document.getElementById("blocks")) {
    e.preventDefault(); return selectWholeNote();     // Ctrl+A outside a text box: the whole note, not the whole web page
  }
  if (e.key === "Escape" && e.target.id !== "blk-ed") { state.settings = false; state.palette = false; state.drawer = false; state.etab = null; state.gpicker = false; state.hmenu = false; state.hlinks = false; state.rail = null; return renderAll(); }
  if (state.palette && e.target.id === "pq") {
    const items = panel.querySelectorAll(".palette .results a");
    if (e.key === "ArrowDown") { e.preventDefault(); state.hi = Math.min(items.length - 1, state.hi + 1); return renderAll(); }
    if (e.key === "ArrowUp") { e.preventDefault(); state.hi = Math.max(0, state.hi - 1); return renderAll(); }
    if (e.key === "Enter" && items[state.hi]) return open(items[state.hi].dataset.open);
  }
}, true);

/* ===================== sketch blocks (v2 preview) ===================== */
// A sketch sits in a note as one line: ![[<note> – sketch <n>.svg]]. Its shapes live in `sketches`
// (in the real app: as JSON inside the .svg file's <metadata>, next to the note).
const SK_W = 600;                                   // canvas width in drawing units; it scales to the panel
const sketches = {
  "Flexbox basics – sketch 1.svg": { h: 240, next: 20, shapes: [
    { id: 9, type: "text", x: 48, y: 30, w: 0, h: 0, text: "display: flex", color: "ink" },
    { id: 1, type: "rect", x: 40, y: 40, w: 420, h: 120, color: "ink" },
    { id: 2, type: "square", x: 64, y: 68, w: 64, h: 64, color: "accent" },
    { id: 3, type: "square", x: 150, y: 68, w: 64, h: 64, color: "accent" },
    { id: 4, type: "square", x: 236, y: 68, w: 64, h: 64, color: "accent" },
    { id: 5, type: "arrow", x: 40, y: 190, w: 420, h: 0, color: "red" },
    { id: 6, type: "text", x: 190, y: 224, w: 0, h: 0, text: "main axis", color: "red" },
    { id: 7, type: "arrow", x: 500, y: 40, w: 0, h: 120, color: "green" },
    { id: 8, type: "text", x: 514, y: 108, w: 0, h: 0, text: "cross", color: "green" },
  ] },
};
const SK_COLORS = { ink: "var(--ink)", accent: "var(--accent)", red: "#d1495b", green: "#2e9e6a", yellow: "#e0a526" };
const SK_TOOLS = [
  ["circle", `<circle cx="10" cy="10" r="7"/>`],
  ["triangle", `<polygon points="10,3 17,17 3,17"/>`],
  ["rect", `<rect x="2" y="5" width="16" height="10" rx="1.5"/>`],
  ["square", `<rect x="4" y="4" width="12" height="12" rx="1.5"/>`],
  ["arrow", `<line x1="3" y1="10" x2="16" y2="10"/><polyline points="12,6 16,10 12,14"/>`],
  ["line", `<line x1="3" y1="15" x2="17" y2="5"/>`],
  ["text", `<text x="10" y="15" text-anchor="middle" font-size="13" fill="currentColor" stroke="none" font-family="serif">T</text>`],
];
const SK_DEFAULT = { circle: [80, 80], triangle: [90, 80], rect: [130, 76], square: [80, 80], arrow: [140, 0], line: [140, 0], text: [0, 0] };
const sk = { name: null, sel: null, color: "ink", drag: null };

const isSketch = raw => /^!\[\[(.+\.svg)\]\]$/.test(raw.trim());
const sketchName = raw => raw.trim().slice(3, -2);
const isLineish = s => s.type === "arrow" || s.type === "line";

function shapeSvg(s) {
  const c = SK_COLORS[s.color] || s.color, st = `stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"`;
  const fill = `fill="${c}" fill-opacity=".07"`, x2 = s.x + s.w, y2 = s.y + s.h;
  let el = "";
  switch (s.type) {
    case "rect": case "square": el = `<rect x="${Math.min(s.x, x2)}" y="${Math.min(s.y, y2)}" width="${Math.abs(s.w)}" height="${Math.abs(s.h)}" rx="6" ${st} ${fill}/>`; break;
    case "circle": el = `<ellipse cx="${s.x + s.w / 2}" cy="${s.y + s.h / 2}" rx="${Math.abs(s.w / 2)}" ry="${Math.abs(s.h / 2)}" ${st} ${fill}/>`; break;
    case "triangle": el = `<polygon points="${s.x + s.w / 2},${s.y} ${x2},${y2} ${s.x},${y2}" ${st} ${fill}/>`; break;
    case "line": case "arrow": {
      const a = Math.atan2(s.h, s.w), L = 14;
      const head = s.type === "arrow" ? `<polyline points="${x2 - L * Math.cos(a - .45)},${y2 - L * Math.sin(a - .45)} ${x2},${y2} ${x2 - L * Math.cos(a + .45)},${y2 - L * Math.sin(a + .45)}" fill="none" ${st}/>` : "";
      el = `<line x1="${s.x}" y1="${s.y}" x2="${x2}" y2="${y2}" stroke="transparent" stroke-width="16"/><line x1="${s.x}" y1="${s.y}" x2="${x2}" y2="${y2}" ${st}/>${head}`; break;
    }
    case "text": el = `<text x="${s.x}" y="${s.y}" fill="${c}" style="font-family:var(--font);font-size:22px">${esc(s.text || "")}</text>`; break;
  }
  return `<g data-shape="${s.id}" style="cursor:move">${el}</g>`;
}
function bbox(s) {
  if (s.type === "text") { const w = Math.max(30, (s.text || "").length * 11); return { x: s.x - 4, y: s.y - 20, w: w + 8, h: 28 }; }
  return { x: Math.min(s.x, s.x + s.w) - 6, y: Math.min(s.y, s.y + s.h) - 6, w: Math.abs(s.w) + 12, h: Math.abs(s.h) + 12 };
}
function sketchInner(name) {
  const d = sketches[name];
  let h = d.shapes.map(shapeSvg).join("");
  const s = sk.name === name && d.shapes.find(z => z.id === sk.sel);
  if (s) {
    const b = bbox(s), hd = (x, y, k) => `<rect data-handle="${k}" x="${x - 7}" y="${y - 7}" width="14" height="14" rx="3" fill="#fff" stroke="var(--accent)" stroke-width="2" style="cursor:nwse-resize"/>`;
    h += `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="none" stroke="var(--accent)" stroke-dasharray="5 4" stroke-width="1.5" pointer-events="none"/>`;
    if (isLineish(s)) h += hd(s.x, s.y, "p1") + hd(s.x + s.w, s.y + s.h, "p2");
    else if (s.type !== "text") h += hd(s.x + s.w, s.y + s.h, "br");
  }
  return h;
}
function sketchHtml(raw, i) {
  const name = sketchName(raw), d = sketches[name];
  if (!d) return `<div class="blk" data-i="${i}"><span data-r="0" class="muted">${esc(raw)} (missing file)</span></div>`;
  const on = sk.name === name;
  const tools = on ? `<div class="sk-tools">
      ${SK_TOOLS.map(([t, icon]) => `<button class="sk-tool" draggable="true" data-sk-tool="${t}" title="Drag a ${t} onto the sketch (or click)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icon}</svg></button>`).join("")}
      <span class="sk-sep"></span>
      ${Object.entries(SK_COLORS).map(([k, c]) => `<button class="sk-col ${sk.color === k ? "on" : ""}" data-sk-color="${k}" style="background:${c}" title="${k}"></button>`).join("")}
      <button class="sk-del" data-sk-del title="Delete the selected shape (Del)">✕ shape</button>
    </div>` : "";
  return `<div class="sk ${on ? "on" : ""}" data-sk="${attr(name)}" data-i="${i}">
    ${tools}
    <svg class="sk-canvas" data-sk-svg="${attr(name)}" viewBox="0 0 ${SK_W} ${d.h}">${sketchInner(name)}</svg>
    ${on && !d.shapes.length ? `<div class="sk-hint">Drag a shape from the bar above into here</div>` : ""}
    <div class="sk-cap"><span>✎ ${on ? "drag to move · corner to resize · double-click text" : "click to draw"}</span><span>${esc(name)}</span></div>
    ${on ? `<div class="sk-resize" data-sk-resize title="Drag to make the sketch taller or shorter"></div>` : ""}
  </div>`;
}
const skSvg = name => panel.querySelector(`[data-sk-svg="${CSS.escape(name)}"]`);
const refreshBlocks = () => { const box = document.getElementById("blocks"); if (box) { box.innerHTML = blocksHtml(); snapToGrid(); } };
function redrawSketch(name) {
  const svg = skSvg(name);
  if (svg) { svg.setAttribute("viewBox", `0 0 ${SK_W} ${sketches[name].h}`); svg.innerHTML = sketchInner(name); snapToGrid(); }
}
function focusSketch(name, sel = null) {
  sk.name = name; sk.sel = sel;
  state.active = null;            // stop text editing while drawing
  refreshBlocks();
}
function toSvgPoint(svg, cx, cy) {
  const p = svg.createSVGPoint(); p.x = cx; p.y = cy;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
function addShape(name, type, x, y) {
  const d = sketches[name], [w, h] = SK_DEFAULT[type];
  const s = { id: d.next++, type, color: sk.color, x: Math.round(x - w / 2), y: Math.round(y - h / 2), w, h };
  if (type === "text") { s.x = Math.round(x - 20); s.y = Math.round(y + 8); s.text = "Text"; }
  d.shapes.push(s);
  sk.name = name; sk.sel = s.id;
  refreshBlocks();
  if (type === "text") editText(name, s.id);
  return s;
}
function newSketch() {
  let n = 1; while (sketches[`${state.current} – sketch ${n}.svg`]) n++;
  const name = `${state.current} – sketch ${n}.svg`;
  sketches[name] = { h: 240, next: 1, shapes: [] };
  return name;
}
function editText(name, id) {
  const s = sketches[name].shapes.find(z => z.id === id), svg = skSvg(name);
  if (!s || !svg || !svg.closest) return;
  const wrap = svg.closest(".sk");
  if (!wrap) return;
  const r = svg.getBoundingClientRect(), k = r.width / SK_W, wr = wrap.getBoundingClientRect();
  const inp = document.createElement("input");
  inp.className = "sk-text-in"; inp.value = s.text || "";
  inp.style.left = (r.left - wr.left + s.x * k - 4) + "px"; inp.style.top = (r.top - wr.top + (s.y - 24) * k) + "px";
  inp.style.font = `${Math.max(12, 22 * k)}px var(--font)`;
  wrap.appendChild(inp); inp.focus(); inp.select();
  const done = () => { s.text = inp.value.trim() || "Text"; inp.remove(); redrawSketch(name); };
  inp.addEventListener("keydown", e => { e.stopPropagation(); if (e.key === "Enter" || e.key === "Escape") { e.preventDefault(); inp.blur(); } });
  inp.addEventListener("blur", done, { once: true });
}
function deleteSelectedShape() {
  if (!sk.name || sk.sel == null) return;
  const d = sketches[sk.name]; d.shapes = d.shapes.filter(z => z.id !== sk.sel); sk.sel = null;
  refreshBlocks();
}

// --- pointer: select, move, resize, line endpoints, sketch height ---
panel.addEventListener("pointerdown", e => {
  // pressing anywhere outside the sketch you are drawing in lets go of it (done on press, not click: the
  // click that follows a press on a sketch lands after the sketch re-rendered and would look like "outside")
  if (sk.name && !e.target.closest(".sk, .g-side, .g-cheat")) { sk.name = null; sk.sel = null; if (!e.target.closest(".blk")) refreshBlocks(); }
  const rz = e.target.closest("[data-sk-resize]");
  if (rz) {
    e.preventDefault();
    const name = rz.closest(".sk").dataset.sk, d = sketches[name], y0 = e.clientY, h0 = d.h, k = SK_W / skSvg(name).getBoundingClientRect().width;
    sk.drag = ev => { d.h = Math.max(120, Math.min(900, Math.round(h0 + (ev.clientY - y0) * k))); redrawSketch(name); };
    return;
  }
  const svg = e.target.closest(".sk-canvas");
  if (!svg) return;
  e.preventDefault();
  const name = svg.dataset.skSvg, d = sketches[name], p0 = toSvgPoint(svg, e.clientX, e.clientY);
  const handle = e.target.closest("[data-handle]"), g = e.target.closest("[data-shape]");
  if (sk.name !== name) return focusSketch(name, g ? +g.dataset.shape : null);
  if (handle) {
    const s = d.shapes.find(z => z.id === sk.sel), o = { ...s };
    sk.drag = ev => {
      const p = toSvgPoint(skSvg(name), ev.clientX, ev.clientY);
      if (handle.dataset.handle === "p1") { s.x = Math.round(p.x); s.y = Math.round(p.y); s.w = o.x + o.w - s.x; s.h = o.y + o.h - s.y; }
      else if (handle.dataset.handle === "p2") { s.w = Math.round(p.x - s.x); s.h = Math.round(p.y - s.y); }
      else {
        s.w = Math.max(16, Math.round(p.x - s.x)); s.h = Math.max(16, Math.round(p.y - s.y));
        if (s.type === "square" || s.type === "circle") s.w = s.h = Math.max(s.w, s.h);
      }
      redrawSketch(name);
    };
    return;
  }
  if (g) {
    const s = d.shapes.find(z => z.id === +g.dataset.shape), o = { x: s.x, y: s.y };
    sk.sel = s.id; redrawSketch(name);
    sk.drag = ev => {
      const p = toSvgPoint(skSvg(name), ev.clientX, ev.clientY);
      s.x = Math.round(o.x + p.x - p0.x); s.y = Math.round(o.y + p.y - p0.y); redrawSketch(name);
    };
    return;
  }
  sk.sel = null; redrawSketch(name);
});
window.addEventListener("pointermove", e => { if (sk.drag) sk.drag(e); });
window.addEventListener("pointerup", () => { sk.drag = null; });
panel.addEventListener("dblclick", e => {
  const g = e.target.closest("[data-shape]"), svg = e.target.closest(".sk-canvas");
  if (!g || !svg) return;
  const s = sketches[svg.dataset.skSvg].shapes.find(z => z.id === +g.dataset.shape);
  if (s && s.type === "text") editText(svg.dataset.skSvg, s.id);
});
// --- palette: drag a shape onto the canvas, or click it to drop it in the middle ---
panel.addEventListener("dragstart", e => {
  const t = e.target.closest && e.target.closest("[data-sk-tool]");
  if (t) { e.dataTransfer.setData("text/x-glacier-shape", t.dataset.skTool); e.dataTransfer.effectAllowed = "copy"; }
});
panel.addEventListener("dragover", e => {
  const svg = e.target.closest && e.target.closest(".sk-canvas");
  if (svg && [...e.dataTransfer.types].includes("text/x-glacier-shape")) { e.preventDefault(); svg.classList.add("drop"); }
});
panel.addEventListener("dragleave", e => { const svg = e.target.closest && e.target.closest(".sk-canvas"); if (svg) svg.classList.remove("drop"); });
panel.addEventListener("drop", e => {
  const svg = e.target.closest && e.target.closest(".sk-canvas"), type = e.dataTransfer.getData("text/x-glacier-shape");
  if (!svg || !type) return;
  e.preventDefault();
  const p = toSvgPoint(svg, e.clientX, e.clientY);
  addShape(svg.dataset.skSvg, type, p.x, p.y);
});
panel.addEventListener("click", e => {
  const t = e.target.closest("[data-sk-tool]");
  if (t) { e.stopPropagation(); const name = t.closest(".sk").dataset.sk; addShape(name, t.dataset.skTool, SK_W / 2, sketches[name].h / 2); return; }
  const c = e.target.closest("[data-sk-color]");
  if (c) {
    e.stopPropagation(); sk.color = c.dataset.skColor;
    const s = sk.name && sketches[sk.name].shapes.find(z => z.id === sk.sel); if (s) s.color = sk.color;
    refreshBlocks(); return;
  }
  if (e.target.closest("[data-sk-del]")) { e.stopPropagation(); deleteSelectedShape(); return; }
}, true);
document.addEventListener("keydown", e => {
  if (!sk.name || (e.target.closest && e.target.closest("input, textarea"))) return;
  if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); deleteSelectedShape(); }
  if (e.key === "Escape") { sk.name = null; sk.sel = null; refreshBlocks(); }
});

/* Split layout: drag the handle between the list and the note */
panel.addEventListener("pointerdown", e => {
  const h = e.target.closest("[data-split-handle]");
  if (!h) return;
  e.preventDefault(); h.setPointerCapture(e.pointerId); document.body.classList.add("resizing");
  const top = panel.querySelector(".split-top"), y0 = e.clientY, h0 = top.getBoundingClientRect().height;
  const max = panel.querySelector(".v").getBoundingClientRect().height - 140;
  const move = ev => { state.splitPx = Math.round(Math.max(70, Math.min(max, h0 + ev.clientY - y0))); top.style.setProperty("--split-h", state.splitPx + "px"); };
  const up = () => { document.body.classList.remove("resizing"); h.removeEventListener("pointermove", move); h.removeEventListener("pointerup", up); };
  h.addEventListener("pointermove", move); h.addEventListener("pointerup", up);
});

/* ===================== resizing ===================== */
// In the real extension Chrome and Firefox resize the sidebar themselves; this handle stands in for that.
const resizer = document.getElementById("resizer");
resizer.addEventListener("pointerdown", e => {
  resizer.setPointerCapture(e.pointerId);
  document.body.classList.add("resizing");
  const move = ev => { panel.style.width = Math.max(260, Math.min(900, window.innerWidth - ev.clientX)) + "px"; snapToGrid(); };
  const up = () => { document.body.classList.remove("resizing"); resizer.removeEventListener("pointermove", move); resizer.removeEventListener("pointerup", up); };
  resizer.addEventListener("pointermove", move);
  resizer.addEventListener("pointerup", up);
});

/* ===================== fake browsing ===================== */
const pagePick = document.getElementById("page-pick");
pagePick.innerHTML = pages.map((p, i) => `<option value="${i}">Go to: ${p.site === "KHAN ACADEMY" ? "Khan" : "Odin"} – ${p.title}</option>`).join("");
pagePick.onchange = () => {
  state.page = +pagePick.value;
  state.lastCourse = pages[state.page].site === "KHAN ACADEMY" ? KHAN : TOP;
  renderCourse();
  const n = noteForPage();
  if (n) open(n); else renderAll();
};

renderCourse();
open(state.current);
if (!params.has("nosync")) runFirstSync();
// prototype self-test: select the whole note, copy it, and leave what landed on the clipboard in the page
if (params.has("selftest-partial")) setTimeout(() => {
  activate(null);
  const s = panel.querySelector(`.blk[data-i="0"] span[data-r]`).firstChild, e2 = panel.querySelector(`.blk[data-i="5"] span[data-r]`).firstChild;
  const r = document.createRange(); r.setStart(s, 2); r.setEnd(e2, 9); getSelection().removeAllRanges(); getSelection().addRange(r);
  const dt = new DataTransfer(); document.dispatchEvent(new ClipboardEvent("copy", { clipboardData: dt, bubbles: true, cancelable: true }));
  const pre = document.createElement("pre"); pre.id = "selftest"; pre.textContent = dt.getData("text/plain"); document.body.appendChild(pre);
}, 300);
if (params.has("selftest-copy")) setTimeout(() => {
  selectWholeNote();
  const dt = new DataTransfer(); document.dispatchEvent(new ClipboardEvent("copy", { clipboardData: dt, bubbles: true, cancelable: true }));
  const pre = document.createElement("pre"); pre.id = "selftest"; pre.textContent = dt.getData("text/plain"); document.body.appendChild(pre);
}, 300);
if (params.has("sketch")) { sk.name = "Flexbox basics – sketch 1.svg"; sk.sel = 2; state.active = null; refreshBlocks(); }   // screenshot helper
</script>
