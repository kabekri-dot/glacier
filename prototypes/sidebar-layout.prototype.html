<!doctype html>
<!--
  PROTOTYPE — throwaway. Do not build on this file.
  Question: what should the Glacier sidebar look like?
  Plan: four structurally different sidebar layouts (glacier button → Layout, or ?variant=A|B|C|D),
  next to a fake course page. Everything is in memory; reload resets it (and replays the first sync).
  URL flags for screenshots: ?settings  ?cheat  ?nosync  ?theme=<key>
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE – Glacier sidebar layouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght,INFL@300..800,0..100&family=Patrick+Hand&family=Kalam:wght@300;400;700&family=Caveat:wght@400..700&family=Architects+Daughter&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #ddd; }
  #stage { display: flex; height: 100vh; }

  /* ---------- fake course website (left) ---------- */
  #course { flex: 1; display: flex; flex-direction: column; background: #fff; color: #222; min-width: 0; }
  #urlbar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #e8e8ea; border-bottom: 1px solid #ccc; }
  #urlbar .url { flex: 1; background: #fff; border-radius: 14px; padding: 4px 12px; color: #555; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #urlbar select { font: inherit; font-size: 12px; }
  #lesson { overflow: auto; padding: 40px 56px 120px; max-width: 760px; }
  #lesson h1 { font-size: 30px; margin: 0 0 16px; }
  #lesson p { font-size: 16px; line-height: 1.6; color: #333; }
  #lesson .site { font-weight: 700; color: #b5562a; letter-spacing: .02em; margin-bottom: 24px; }

  /* ---------- resize handle ---------- */
  #resizer { width: 7px; margin: 0 -3px; flex: none; cursor: col-resize; z-index: 40; position: relative; }
  #resizer::after { content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 1px; background: rgba(0,0,0,.2); transition: background .15s, width .15s, left .15s; }
  #resizer:hover::after, body.resizing #resizer::after { background: #2a87b0; width: 3px; left: 2px; }
  body.resizing { cursor: col-resize; user-select: none; }

  /* ---------- Glacier panel (right) ---------- */
  .glacier {
    --lh: 24px; --mono: 12px;
    width: 380px; flex: none; height: 100vh; position: relative; overflow: visible;
    background: var(--paper); color: var(--ink);
    font: 13px/1.4 system-ui, sans-serif;
  }
  .glacier button, .glacier input, .glacier select { font: inherit; color: inherit; }

  /* The panel is a row: the settings column (when open) on the left, the notebook takes what's left and reflows. */
  .shell { display: flex; height: 100%; min-height: 0; overflow: hidden; }
  .main { flex: 1 1 0; min-width: 0; position: relative; display: flex; flex-direction: column; container-type: inline-size; transition: flex-basis .25s; }
  .v { display: flex; flex-direction: column; height: 100%; min-height: 0; position: relative; }
  @container (max-width: 250px) {
    .bar .meta, .bar .words { display: none; }
    .sheet { padding-left: 12px !important; padding-right: 12px; }
  }

  .sheet {
    flex: 1; overflow: auto; min-height: 0;
    padding: var(--lh) 18px var(--lh) var(--pad-left, 18px);
    background-image: var(--pattern); background-size: var(--pattern-size, auto);
    background-repeat: var(--pattern-repeat, repeat); background-position: var(--pattern-pos, 0 0);
    background-attachment: var(--pattern-attach, local);
    font-family: var(--font); font-weight: var(--fw); font-size: var(--fs); line-height: var(--lh);
    font-variation-settings: "INFL" 25;
  }
  .sheet .title { font-size: 1.5em; line-height: calc(var(--lh) * 2); margin: 0; font-weight: inherit; }
  .sheet ul { margin: 0 0 var(--lh); padding-left: 1.1em; }
  .sheet h2 { margin: 0; font-weight: inherit; font-size: 1.25em; line-height: var(--lh); }
  .sheet code { font-family: "JetBrains Mono", Consolas, monospace; font-size: var(--mono); background: rgba(127,127,127,.15); padding: 1px 3px; border-radius: 3px; }
  a.link { color: var(--accent); text-decoration: none; border-bottom: 1px dashed currentColor; cursor: pointer; }
  a.missing { color: var(--missing); border-bottom: 1px dotted currentColor; cursor: pointer; }

  /* ---------- live-preview writing surface ---------- */
  .blocks { min-height: 45vh; padding-bottom: calc(var(--lh) * 2 + 84px);   /* room below the last line, clear of the paper picture */ cursor: text; }
  .blk { min-height: var(--lh); white-space: pre-wrap; overflow-wrap: break-word; }
  .blk.h1, .blk-ed.h1 { font-size: 1.6em; line-height: calc(var(--lh) * 2); font-weight: bolder; }
  .blk.h2, .blk-ed.h2 { font-size: 1.3em; line-height: calc(var(--lh) * 2); font-weight: bolder; }
  .blk.h3, .blk-ed.h3 { font-size: 1.12em; line-height: var(--lh); font-weight: bolder; }
  .blk.li { position: relative; }
  .blk .bullet { position: absolute; margin-left: -.9em; color: var(--muted); }
  pre.blk { margin: 0; font-family: "JetBrains Mono", Consolas, monospace; font-size: var(--mono); line-height: var(--lh);
            background: rgba(127,127,127,.12); padding: 0 8px; border-radius: 3px; overflow-x: auto; scrollbar-width: none; white-space: pre; }   /* no scrollbar: it would add height and break the line grid */
  .blk-ed {
    display: block; margin: 0 0 0 -4px; padding: 0 4px; width: calc(100% + 8px);
    border: 0; outline: 0; resize: none; overflow: hidden; border-radius: 4px;
    background: rgba(127,127,127,.08); color: inherit; font: inherit; line-height: var(--lh);
    font-variation-settings: "INFL" 25;
  }
  .blk-ed.code { font-family: "JetBrains Mono", Consolas, monospace; font-size: var(--mono); white-space: pre; overflow-x: auto; padding: 0 8px; background: rgba(127,127,127,.16); }
  .blk-ed::placeholder { color: var(--muted); font-style: italic; opacity: .7; }

  .ed-wrap { position: relative; }
  /* "+" at the left of the line you're on: opens the insert menu (headings, lists, sketch…) */
  .ed-plus { position: absolute; left: -17px; top: calc((var(--lh) - 16px) / 2); width: 16px; height: 16px; padding: 0; z-index: 2;
             border: 1px solid var(--line); border-radius: 50%; background: var(--paper); color: var(--muted); cursor: pointer;
             font: 13px/13px system-ui, sans-serif; display: grid; place-items: center; transition: transform .12s, color .12s; }
  .ed-plus:hover { color: var(--accent); border-color: var(--accent); transform: scale(1.15); }
  .slash { position: absolute; top: 100%; left: 0; z-index: 12; width: min(270px, 100%); margin-top: 4px; padding: 5px;
           background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
           box-shadow: 0 8px 26px rgba(0,0,0,.2); font: 13px/1.3 system-ui, sans-serif; }
  .slash .hd { padding: 4px 8px 6px; font-size: 11px; color: var(--muted); }
  .slash a { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px; cursor: pointer; }
  .slash a.hi { background: rgba(127,127,127,.16); }
  .slash a span { flex: 1; }
  .slash code { font: 11.5px "JetBrains Mono", Consolas, monospace; color: var(--accent); background: rgba(127,127,127,.12); padding: 1px 5px; border-radius: 4px; }

  /* ---------- sketch blocks (v2 preview) ---------- */
  .sk { position: relative; margin: 0; border: 1.5px dashed var(--line); border-radius: 10px; background: color-mix(in srgb, var(--paper) 70%, transparent); font: 12px/1.3 system-ui, sans-serif; white-space: normal; }
  .sk:hover { border-color: var(--muted); }
  .sk.on { border: 1.5px solid var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }
  .sk-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 5px; background: var(--chrome); border-bottom: 1px solid var(--line); border-radius: 9px 9px 0 0; }
  .sk-tool { width: 32px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); color: var(--ink); cursor: grab; display: grid; place-items: center; }
  .sk-tool:hover { border-color: var(--accent); transform: translateY(-1px); }
  .sk-tool:active { cursor: grabbing; }
  .sk-tool svg { width: 20px; height: 20px; }
  .sk-sep { width: 1px; height: 22px; background: var(--line); margin: 0 3px; }
  .sk-col { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
  .sk-col.on { box-shadow: 0 0 0 2px var(--accent); }
  .sk-del { margin-left: auto; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 4px 6px; border-radius: 6px; }
  .sk-del:hover { background: rgba(127,127,127,.15); color: var(--missing); }
  .sk-canvas { display: block; width: 100%; height: auto; touch-action: none; color: var(--ink); }
  .sk-canvas.drop { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .sk-cap { display: flex; justify-content: space-between; gap: 8px; padding: 3px 9px 5px; color: var(--muted); font-size: 11px; }
  .sk-cap span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sk-hint { position: absolute; left: 0; right: 0; bottom: 40%; text-align: center; color: var(--muted); pointer-events: none; font-size: 12px; }
  .sk-text-in { position: absolute; z-index: 5; padding: 1px 4px; border: 1px solid var(--accent); border-radius: 4px; background: var(--paper); color: var(--ink); outline: 0; }
  .sk-resize { position: absolute; left: 50%; bottom: -6px; width: 34px; height: 10px; margin-left: -17px; border-radius: 5px; background: var(--line); cursor: ns-resize; opacity: 0; }
  .sk.on .sk-resize, .sk:hover .sk-resize { opacity: 1; }

  /* ---------- bars and small parts ---------- */
  .bar { display: flex; align-items: center; gap: 6px; padding: 7px 10px; background: var(--chrome); border-bottom: 1px solid var(--line); flex: none; min-width: 0; }
  .bar.bottom { border-bottom: 0; border-top: 1px solid var(--line); }
  .grow { flex: 1; min-width: 0; }
  .ellip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn { background: none; border: 1px solid transparent; padding: 3px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: rgba(127,127,127,.18); }
  .meta { font: 12px system-ui, sans-serif; color: var(--muted); }
  .meta a { color: var(--muted); }
  .muted { color: var(--muted); }
  .input { width: 100%; min-width: 0; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); outline: 0; }
  .input:focus { border-color: var(--accent); }

  .sync { background: none; border: 0; padding: 2px 4px; cursor: pointer; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .sync i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .sync-synced i { background: #4a9a5c; } .sync-syncing i { background: #d0a020; animation: pulse 1s infinite; }
  .sync-offline i { background: #9a9a9a; } .sync-conflict i { background: #c0392b; }
  .sync-conflict { color: #c0392b; }
  @keyframes pulse { 50% { opacity: .3; } }

  .banner { margin: 8px 10px 0; padding: 8px 10px; border: 1px dashed var(--muted); border-radius: 6px; background: var(--chrome); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex: none; }
  .banner .btn { border-color: var(--line); }

  .tree { padding: 4px 6px 16px; }
  .tree .section { font: 600 11px system-ui; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 12px 8px 4px; }
  .tree details > summary { cursor: pointer; padding: 4px 8px; font-weight: 600; list-style: none; }
  .tree details > summary::before { content: "▸ "; color: var(--muted); }
  .tree details[open] > summary::before { content: "▾ "; }
  .tree a { display: block; padding: 3px 8px 3px 22px; border-radius: 5px; cursor: pointer; color: inherit; text-decoration: none; }
  .tree a:hover { background: rgba(127,127,127,.12); }
  .tree a.cur { background: rgba(127,127,127,.22); }
  .tree .concepts a { padding-left: 8px; }

  .results a { display: block; padding: 6px 10px; border-radius: 6px; cursor: pointer; color: inherit; text-decoration: none; }
  .results a:hover, .results a.hi { background: rgba(127,127,127,.15); }
  .results .snip { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .results mark { background: rgba(240,200,60,.45); color: inherit; }

  /* A: drawer */
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.25); z-index: 5; }
  .drawer { position: absolute; top: 0; bottom: 0; left: 0; width: min(300px, 85%); background: var(--chrome); z-index: 6; display: flex; flex-direction: column; box-shadow: 4px 0 16px rgba(0,0,0,.2); }
  .drawer .scroll { flex: 1; overflow: auto; }
  .backfoot { flex: none; border-top: 1px solid var(--line); background: var(--chrome); max-height: 40%; overflow: auto; }
  .backfoot summary { padding: 7px 12px; cursor: pointer; color: var(--muted); }
  .backfoot a { display: block; padding: 3px 12px 3px 24px; cursor: pointer; color: var(--accent); }
  /* B: tabs */
  .tabs { display: flex; align-items: center; border-top: 1px solid var(--line); background: var(--chrome); flex: none; padding-right: 64px; }
  .tabs button { flex: 1; background: none; border: 0; padding: 10px 0 9px; cursor: pointer; color: var(--muted); border-top: 2px solid transparent; }
  .tabs button.on { color: var(--ink); border-top-color: var(--accent); }
  .inline-back { border-top: 1px dashed var(--muted); padding-top: calc(var(--lh) - 1px); color: var(--muted); }
  /* C: breadcrumb + palette */
  .crumbs { font-size: 12.5px; }
  .crumbs a { cursor: pointer; color: var(--muted); }
  .crumbs a:hover { color: var(--ink); }
  .crumbs b { font-weight: 600; }
  .chips { margin: 0 0 var(--lh); font: 12px/var(--lh) system-ui; color: var(--muted); }
  .chips a { display: inline-block; margin: 0 4px 4px 0; padding: 0 8px; border-radius: 10px; background: rgba(127,127,127,.15); color: var(--ink); cursor: pointer; }
  .palette-wrap { position: absolute; inset: 0; background: rgba(0,0,0,.25); z-index: 5; padding: 50px 14px; }
  .palette { background: var(--chrome); border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.3); padding: 8px; }
  .kbd { font: 11px system-ui; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--muted); }
  /* D: split */
  .split-top { height: var(--split-h, 42%); min-height: 70px; display: flex; flex-direction: column; background: var(--chrome); flex: none; }
  /* drag this bar to make the list taller or shorter */
  .split-handle { flex: none; height: 9px; cursor: ns-resize; background: var(--chrome); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); display: grid; place-items: center; touch-action: none; }
  .split-handle::after { content: ""; width: 36px; height: 3px; border-radius: 2px; background: var(--muted); opacity: .5; }
  .split-handle:hover::after, body.resizing .split-handle::after { background: var(--accent); opacity: 1; }
  .split-top .scroll { flex: 1; overflow: auto; }
  .split-bottom { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .back-small { font: 12px/1.6 system-ui; color: var(--muted); }

  /* ---------- shortcuts panel: docked to the left of the sidebar like settings; folds into a slim tab ---------- */
  .g-cheat { position: absolute; top: 0; bottom: 0; right: 100%; width: 230px; overflow: auto; z-index: 49;
             background: #f7fbfe; color: #1d3446; border-left: 1px solid #d3e3ee; border-radius: 14px 0 0 14px;
             box-shadow: -10px 0 30px rgba(20,60,90,.18); font: 12.5px/1.35 system-ui, sans-serif; animation: g-slide .3s cubic-bezier(.2,.9,.3,1.05); }
  .glacier.with-settings .g-cheat { right: calc(100% + 260px); }
  /* "inside" = the browser does NOT let Glacier draw next to the sidebar: both panels then open INSIDE it, over the note */
  .glacier.inside .g-side, .glacier.inside .g-cheat { right: 0; width: 100%; border-radius: 0; border-left: 0; box-shadow: none; }
  .glacier.inside .g-cheat { z-index: 51; }
  .glacier.inside .g-hero, .glacier.inside .g-cheat-hd { border-radius: 0; }
  .glacier.inside .g-cheat.folded { right: auto; left: 0; width: 24px; height: 130px; border-radius: 0 10px 10px 0; z-index: 16; box-shadow: 3px 2px 10px rgba(20,60,90,.25); }
  .glacier.inside .g-cheat.folded:hover { width: 28px; }
  .glacier.inside .g-cheat.folded span { font-size: 11.5px; }
  .g-cheat-hd { position: sticky; top: 0; z-index: 1; height: 56px; overflow: hidden; border-radius: 14px 0 0 0; }
  .g-cheat-hd svg { display: block; width: 100%; height: 100%; }
  .g-cheat-hd b { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font: 600 16px "Shantell Sans", sans-serif; color: #fff; text-shadow: 0 2px 6px rgba(15,50,80,.6); }
  .g-cheat-hd .acts { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: flex; gap: 4px; }
  .g-cheat-hd .acts button { width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(255,255,255,.85); color: #1d3446; cursor: pointer; font-size: 12px; }
  .g-cheat-hd .acts button:hover { background: #fff; }
  .g-cheat-body { padding: 2px 14px 16px; }
  .cheat-grp { margin: 12px 0 6px; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: #7c93a6; }
  .cheat-rows { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; }
  .cheat-rows code { font: 11.5px "JetBrains Mono", Consolas, monospace; color: #1f6d91; background: #e7f2f9; padding: 2px 6px; border-radius: 5px; justify-self: start; white-space: pre; }
  .cheat-rows span { color: #4d6578; }
  /* folded: a slim vertical tab against the sidebar's edge — click to open again */
  .g-cheat.folded { top: 96px; bottom: auto; width: 32px; height: 150px; padding: 0; border: 0; border-radius: 10px 0 0 10px; cursor: pointer; overflow: hidden;
                    display: grid; place-items: center; background: linear-gradient(#3b9cc6, #1f6d91); color: #fff; box-shadow: -4px 2px 12px rgba(20,60,90,.25); transition: width .15s; }
  .g-cheat.folded:hover { width: 38px; }
  .g-cheat.folded span { writing-mode: vertical-rl; transform: rotate(180deg); font: 600 12.5px system-ui, sans-serif; letter-spacing: .04em; white-space: nowrap; }

  /* E: index tabs */
  .e-wrap { flex-direction: row; }
  .e-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .e-tabs { width: 30px; flex: none; display: flex; flex-direction: column; gap: 5px; padding: 58px 0 80px; background: var(--chrome); border-left: 1px solid var(--line); }
  .e-tab { width: 28px; margin-left: -4px; padding: 12px 0; border: 0; border-radius: 0 9px 9px 0; background: var(--tab); color: #2b2a27; cursor: pointer;
           box-shadow: 1px 1px 3px rgba(0,0,0,.12); font: 11.5px/1 system-ui, sans-serif; transition: margin .15s, width .15s; }
  .e-tab span { writing-mode: vertical-rl; display: inline-block; max-height: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .e-tab:hover { margin-left: -8px; width: 32px; }
  .e-tab.here { font-weight: 700; }
  .e-tab.on { margin-left: -10px; width: 34px; box-shadow: -2px 0 0 var(--accent) inset, 1px 1px 3px rgba(0,0,0,.15); }
  .e-search { --tab: var(--paper); display: grid; place-items: center; color: var(--ink); padding: 8px 0; }
  .e-search svg { width: 16px; height: 16px; }
  .e-sheet { position: absolute; top: 0; bottom: 0; right: 30px; width: min(270px, 86%); z-index: 6; background: var(--chrome); display: flex; flex-direction: column; box-shadow: -6px 0 18px rgba(0,0,0,.18); }
  .e-list { flex: 1; overflow: auto; }

  /* F: home */
  .f-home { font: 13px/1.4 system-ui, sans-serif; }
  .f-hi { font: 600 22px/1.3 var(--font); margin: 2px 0 12px; }
  .f-search { margin-bottom: 6px; padding: 9px 12px; border-radius: 10px; }
  .f-h { margin: 16px 0 6px; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .f-card { display: block; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 7px; border-radius: 11px; cursor: pointer; color: var(--ink);
            background: color-mix(in srgb, var(--paper) 70%, var(--chrome)); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(0,0,0,.05); text-decoration: none; transition: transform .12s, box-shadow .12s; }
  .f-card:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
  .f-card b { display: block; font: 600 15px/1.3 var(--font); }
  .f-card small { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .f-new { border-style: dashed; color: var(--accent); }
  .f-new b { color: var(--accent); }
  .f-course { border: 1px solid var(--line); border-radius: 11px; margin-bottom: 7px; overflow: hidden; background: color-mix(in srgb, var(--paper) 70%, var(--chrome)); }
  .f-course > button { display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 10px 12px; border: 0; background: none; cursor: pointer; text-align: left; }
  .f-course > button b { font: 600 14px var(--font); } .f-course > button small { color: var(--muted); flex: 1; } .f-course > button span { color: var(--muted); }
  .f-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .f-chips a { padding: 4px 11px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--ink); cursor: pointer; }
  .f-chips a.add { background: none; border: 1px dashed var(--line); color: var(--muted); }
  .f-back { font-weight: 600; color: var(--accent); }

  /* G: note tabs */
  .g-tabs { display: flex; align-items: flex-end; gap: 2px; padding: 6px 6px 0; background: var(--chrome); border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }

/* ===================== pixel art ===================== */
// Every scene = smooth background (sky, sun, water, sand) + a layer of hand-placed pixels (ice, trees, rock…).
let uid = 0;
function Px() {
  const g = new Map();
  return {
    set(x, y, c) { if (x >= 0 && y >= 0 && c) g.set(y * 1000 + x, c); },
    has(x, y) { return g.has(y * 1000 + x); },
    each(fn) { g.forEach((c, k) => fn(k % 1000, Math.floor(k / 1000), c)); },
    rects(W, H) {                       // merge horizontal runs of one colour into a single <rect>
      let out = "";
      for (let y = 0; y < H; y++) {
        let run = null;
        const flush = () => { if (run) out += `<rect x="${run.x}" y="${y}" width="${run.w}" height="1" fill="${run.c}"/>`; run = null; };
        for (let x = 0; x < W; x++) {
          const c = g.get(y * 1000 + x);
          if (run && run.c === c) run.w++; else { flush(); if (c) run = { x, w: 1, c }; }
        }
        flush();
      }
      return out;
    },
  };
}
// Pixel reflection in water: mirrored, every other row only — the classic pixel-art shimmer.
function reflect(px, base, H) {
  const r = Px();
  px.each((x, y, c) => { if (y < base) { const ry = 2 * base - 1 - y; if (ry < H && (ry - base) % 2 === 0) r.set(x, ry, c); } });
  return r;
}
const JIT = [0, 1, 0, 0, 1, 1, 0, 0, 0, 1, 0, 1, 0, 0, 2, 1, 0];
const pxLayer = (px, W, H, extra = "") => `<g shape-rendering="crispEdges" ${extra}>${px.rects(W, H)}</g>`;
const lin = (id, stops, vertical = true) => `<linearGradient id="${id}" x1="0" y1="0" x2="${vertical ? 0 : 1}" y2="${vertical ? 1 : 0}">${stops.map(([o, c, a = 1]) => `<stop offset="${o}" stop-color="${c}" stop-opacity="${a}"/>`).join("")}</linearGradient>`;
const glow = (id, c) => `<radialGradient id="${id}"><stop offset="0" stop-color="${c}"/><stop offset=".35" stop-color="${c}" stop-opacity=".85"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`;

function mountains(px, W, base, peaks, pal) {
  for (let x = 0; x < W; x++) {
    let top = Infinity, p = null;
    for (const q of peaks) {
      const dx = Math.abs(x - q.x), t = q.top + Math.round(dx * (q.s || 1)) + (dx > 1 ? JIT[(x * 7 + q.x) % JIT.length] : 0);   // q.s = steepness
      if (t < top) { top = t; p = q; }
    }
    for (let y = Math.max(0, top); y < base; y++) {
      const d = y - top, lit = x <= p.x, f = d / Math.max(1, base - top), tone = f < .34 ? 0 : f < .67 ? 1 : 2;
      const snowDepth = pal.snow ? 2 + JIT[(x * 5 + 3) % JIT.length] : 0;
      let c;
      if (d < snowDepth && y < base - 4) c = lit ? pal.snow : pal.snowS;
      else if (lit && d >= 3 && (x + y) % 7 === 0) c = pal.streakL;
      else if (!lit && d >= 3 && (x - y + 700) % 6 === 0) c = pal.streakS;
      else c = (lit ? pal.lit : pal.shade)[tone];
      px.set(x, y, c);
    }
  }
}

// Scenes work at any width: features (peaks, trees, boats, cacti…) are placed every so many pixels with
// seeded variation, so a wider picture shows MORE landscape instead of a stretched one.
const rnd = i => { const s = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };
const sunX = W => Math.min(W * .82, 96);
// smooth 1-D value noise: gentle, irregular ups and downs (used for ranges and dunes)
const noise = (x, seed, scale) => { const i = Math.floor(x / scale), f = x / scale - i, a = rnd(i + seed * 101), b = rnd(i + 1 + seed * 101), t = f * f * (3 - 2 * f); return a + (b - a) * t; };
const scenes = {
  glacier(W, H) {
    const id = "s" + (++uid), base = Math.round(H * .68), px = Px(), far = Px();
    const pal = { snow: "#ffffff", snowS: "#d0e6f5", lit: ["#eaf6fd", "#d8edf9", "#c5e2f4"], shade: ["#acd3eb", "#96c5e3", "#80b6da"], streakL: "#bcdcf0", streakS: "#6ea6cf" };
    if (W <= 20) mountains(px, W, base, [{ x: Math.round(W * .38), top: Math.round(H * .14) }, { x: Math.round(W * .76), top: Math.round(H * .36) }], pal);
    else {
      // 1. a hazy far range behind, from smooth noise (no two stretches alike)
      let prev = 0;
      for (let x = 0; x < W; x++) {
        const farH = t => H * (.16 + .3 * noise(t, 3, 11) + .1 * noise(t, 7, 3)), want = Math.round(farH(x));
        const top = x ? Math.max(prev - 1, Math.min(prev + 1, want)) : want;     // at most 1 pixel per column: soft ridges
        const lit = farH(x + 2) <= farH(x - 2);      // shade by the smooth slope, not per column
        for (let y = top; y < base; y++) far.set(x, y, y - top < 1 ? "#eef5fa" : lit ? "#dce9f2" : "#cddeeb");
        prev = top;
      }
      // 2. the near peaks: uneven spacing, height AND steepness vary per peak, some gaps left open
      const peaks = [];
      for (let i = 0, x = 7; x < W + 14; i++, x += 12 + Math.round(rnd(i) * 22)) {
        if (rnd(i + 300) < .18) continue;
        peaks.push({ x, top: Math.round(H * (.1 + rnd(i + 50) * .34)), s: .7 + rnd(i + 120) * .9 });
      }
      mountains(px, W, base, peaks, pal);
      // 3. glacier tongues: flat ice shelves reaching the water, ending in a blue ice cliff
      for (let i = 0, x = 22 + Math.round(rnd(5) * 20); x < W; i++, x += 60 + Math.round(rnd(i + 200) * 90)) {
        const w = 12 + Math.round(rnd(i + 210) * 16), top = base - 3 - Math.round(rnd(i + 220) * 2);
        for (let xx = x; xx < x + w; xx++) for (let y = top; y < base; y++)
          px.set(xx, y, y === top ? "#ffffff" : y === top + 1 ? "#e3f1fa" : (xx - x) % 3 === 0 ? "#79abd2" : "#a3cce8");
      }
    }
    for (let x = 0; x < W; x++) if (px.has(x, base - 1) && x % 4 !== 1) px.set(x, base, "#e6f4fc");     // foam at the shore
    // 4. icebergs in a few different shapes and sizes
    const bergs = [["..W..", ".WWS.", "WWWSS"], ["W...", "WW..", "WWWS"], [".WW", "WWS"], ["...W.", "..WWS", ".WWWS", "WWWSS"], ["WWS"]];
    for (let i = 0, x = 7; x < W; i++, x += 18 + Math.round(rnd(i + 9) * 40)) {
      const b = bergs[Math.floor(rnd(i + 400) * bergs.length)], y = base + 2 + Math.round(rnd(i + 3) * (H - base - 3));
      b.forEach((row, r) => [...row].forEach((ch, c) => px.set(x + c, y - b.length + 1 + r, { W: "#ffffff", S: "#cfe6f5" }[ch])));
    }
    const refl = reflect(px, base, H);
    return { W, H, body: `<defs>${lin(id + "s", [[0, "#86bde2"], [.7, "#d9eef9"], [1, "#fbf1e2"]])}${glow(id + "g", "#fff6d6")}${lin(id + "w", [[0, "#5fa2cd"], [1, "#1f527d"]])}</defs>
      <rect width="${W}" height="${H}" fill="url(#${id}s)"/><circle cx="${sunX(W)}" cy="${H * .24}" r="${H * .24}" fill="url(#${id}g)"/>
      ${pxLayer(far, W, H)}
      <rect y="${base}" width="${W}" height="${H - base}" fill="url(#${id}w)"/>${pxLayer(refl, W, H, 'opacity=".2"')}${pxLayer(px, W, H)}` };
  },
  forest(W, H) {
    const id = "s" + (++uid), ground = Math.round(H * .78), px = Px();
    const pine = (x0, baseY, h, light, dark, trunk) => {
      for (let r = 0; r < h - 1; r++) {
        const half = Math.min(4, Math.floor(r / 3) + (r % 3)), y = baseY - h + 1 + r;
        for (let x = x0 - half; x <= x0 + half; x++) px.set(x, y, x <= x0 ? light : dark);
      }
      px.set(x0, baseY, trunk);
    };
    for (let i = 0, x = 2; x < W + 4; i++, x += 4 + Math.round(rnd(i) * 4)) pine(x, ground - 2, 5 + Math.round(rnd(i + 30) * 3), "#9cc79a", "#83b383", "#8a6a4a");
    for (let i = 0, x = 5; x < W + 4; i++, x += 8 + Math.round(rnd(i + 70) * 8)) pine(x, ground + 1, 8 + Math.round(rnd(i + 90) * 3), "#4f8f4c", "#3a723c", "#6b4a2f");
    for (let x = 1; x < W; x += 5) px.set(x, H - 2, x % 3 ? "#f4d35e" : "#ffffff");
    const hills = Array.from({ length: Math.ceil(W / 40) + 1 }, (_, i) => `<ellipse cx="${i * 40 + 10}" cy="${ground + 2}" rx="${28 + rnd(i) * 14}" ry="${H * (.18 + rnd(i + 4) * .1)}" fill="${i % 2 ? "#a9cf9c" : "#b6d6aa"}"/>`).join("");
    return { W, H, body: `<defs>${lin(id + "s", [[0, "#bfe1da"], [1, "#f1f6e4"]])}${glow(id + "g", "#fff7d9")}${lin(id + "m", [[0, "#8dbb7c"], [1, "#5f9152"]])}</defs>
      <rect width="${W}" height="${H}" fill="url(#${id}s)"/><circle cx="${sunX(W)}" cy="${H * .22}" r="${H * .22}" fill="url(#${id}g)"/>
      ${hills}<rect y="${ground}" width="${W}" height="${H - ground}" fill="url(#${id}m)"/>${pxLayer(px, W, H)}` };
  },
  ocean(W, H) {
    const id = "s" + (++uid), hz = Math.round(H * .45), px = Px(), sx = Math.round(sunX(W));
    for (let y = hz + 2; y < H; y += 3) for (let x = 0; x < W; x++) { const k = (x * 3 + y * 5) % 17; if (k === 0) { px.set(x, y, "#d9f0f8"); px.set(x + 1, y, "#d9f0f8"); } else if (k === 9) px.set(x, y, "#8fcbe3"); }
    for (let y = hz + 1; y < H; y += 2) { const w = 1 + ((y * 3) % 3); for (let i = -w; i <= w; i++) px.set(sx + i, y, "#fff3c4"); }
    const boat = (bx, by) => ["....W....", "....WS...", "...WWSS..", "..WWWSSS.", "....M....", "HHHHHHHHH", ".hhhhhhh."].forEach((row, r) =>
      [...row].forEach((ch, c) => px.set(bx - 4 + c, by - 6 + r, { W: "#ffffff", S: "#dce9f1", M: "#6b4f3a", H: "#c0583a", h: "#8e3f22" }[ch])));
    for (let i = 0, x = Math.max(6, Math.round(W * .22)); x < W; i++, x += 70 + Math.round(rnd(i) * 60)) boat(x, hz + 3 + Math.round(rnd(i + 8) * 2));
    for (let i = 0, x = Math.round(W * .42); x < W; i++, x += 18 + Math.round(rnd(i + 20) * 30)) {   // gulls
      const y = Math.round(H * (.08 + rnd(i + 40) * .14)); px.set(x, y, "#5b6b78"); px.set(x + 1, y + 1, "#5b6b78"); px.set(x + 2, y, "#5b6b78");
    }
    return { W, H, body: `<defs>${lin(id + "s", [[0, "#9fd2ec"], [1, "#eaf6fb"]])}${glow(id + "g", "#fff4cf")}${lin(id + "w", [[0, "#4aa3c7"], [1, "#16577d"]])}</defs>
      <rect width="${W}" height="${H}" fill="url(#${id}s)"/><circle cx="${sx}" cy="${H * .2}" r="${H * .26}" fill="url(#${id}g)"/>
      <rect y="${hz}" width="${W}" height="${H - hz}" fill="url(#${id}w)"/>${pxLayer(px, W, H)}` };
  },
  desert(W, H) {
    const id = "s" + (++uid), px = Px(), far = Px();
    // 1. distant mesas (flat-topped rocks with stepped sides), irregularly spaced
    if (W > 30) for (let i = 0, x = 6 + Math.round(rnd(77) * 20); x < W; i++, x += 34 + Math.round(rnd(i + 30) * 70)) {
      const w = 6 + Math.round(rnd(i + 31) * 16), top = Math.round(H * (.36 + rnd(i + 32) * .14)), foot = Math.round(H * .72);
      for (let xx = x - 3; xx <= x + w + 3; xx++) {
        const t = top + (xx < x ? (x - xx) * 2 : xx > x + w ? (xx - x - w) * 2 : 0);
        for (let y = t; y < foot; y++) far.set(xx, y, y === t && xx >= x && xx <= x + w ? "#efcfaa" : xx < x + w * .4 ? "#e2b48c" : "#d4a17a");
      }
    }
    // 2. dunes from layered noise, so no two stretches repeat
    const back = x => H * .6 + 4.4 * (noise(x, 11, 16) - .5) + 1.4 * Math.sin(x / 5.3 + noise(x, 12, 30) * 6);
    const front = x => H * .8 + 3.2 * (noise(x, 21, 11) - .5) + .9 * Math.sin(x / 3.7 + noise(x, 22, 25) * 6);
    const dune = (fn, lit, shade, ripple) => {
      for (let x = 0; x < W; x++) {
        const h = Math.round(fn(x)), isLit = fn(x + 1.5) - fn(x - 1.5) <= 0, wob = Math.floor(noise(x, 5, 6) * 3);   // shade by the smooth slope: no stripes
        for (let y = h; y < H; y++) px.set(x, y, ripple && y > h + 1 && (x * 2 + y + wob) % 11 === 0 ? ripple : isLit ? lit : shade);
      }
    };
    dune(back, "#ebc48c", "#d6a66a");
    // 3. a small camel caravan on the far dune ridge (only where there's room)
    const camel = [".......C.", "..CC..CC.", ".CCCCCC..", "CCCCCCC..", ".C.C.C.C.", ".C.C.C.C."];
    for (const cx of [150, 430, 610]) if (cx + 30 < W) for (let k = 0; k < 3; k++) {
      const x0 = cx + k * 11, y0 = Math.round(back(x0 + 4)) - camel.length;
      camel.forEach((row, r) => [...row].forEach((ch, c) => ch === "C" && px.set(x0 + c, y0 + r, "#9a6a45")));
    }
    dune(front, "#f3d39d", "#deb173", "#d9a865");
    // 4. plants and rocks: tall saguaros, round barrel cacti, dry bushes, stones — mixed at random gaps
    const saguaro = h => ["...G...", ".G.G...", ".G.G.G.", ".GGG.G.", "...GGG.", ...Array(h - 5).fill("...G...")];
    const kinds = {
      saguaro: i => saguaro(6 + Math.round(rnd(i + 95) * 3)),
      barrel: () => [".GG.", "GGGG", "GGGG"],
      bush: () => ["B.B.B", ".BBB."],
      rock: () => [".RR.", "RRRR"],
    };
    const colors = { G: ["#5c9a55", "#467f43"], B: ["#a88a5a", "#8d7046"], R: ["#b9a08a", "#9c8370"] };
    for (let i = 0, x = Math.round(Math.min(W * .78, 24)); x < W + 4; i++, x += 14 + Math.round(rnd(i + 90) * 46)) {
      const r = rnd(i + 91), kind = r < .34 ? "saguaro" : r < .56 ? "barrel" : r < .8 ? "bush" : "rock";
      const spr = kinds[kind](i), base = Math.round(front(x + 2));
      spr.forEach((row, ry) => [...row].forEach((ch, c) => ch !== "." && px.set(x + c, base - spr.length + ry + 1, colors[ch][c < row.length / 2 ? 0 : 1])));
    }
    const sx = Math.min(W * .3, 40);
    return { W, H, body: `<defs>${lin(id + "s", [[0, "#f3c48a"], [.75, "#fbe6c8"], [1, "#fdf0dc"]])}${glow(id + "g", "#fff1c4")}</defs>
      <rect width="${W}" height="${H}" fill="url(#${id}s)"/><circle cx="${sx}" cy="${H * .32}" r="${H * .3}" fill="url(#${id}g)"/><circle cx="${sx}" cy="${H * .32}" r="${H * .1}" fill="#fff7dc"/>
      ${pxLayer(far, W, H, 'opacity=".75"')}${pxLayer(px, W, H)}` };
  },
  volcano(W, H) {
    const id = "s" + (++uid), base = Math.round(H * .86), px = Px(), crater = Math.round(H * .3);
    const cones = [];
    for (let i = 0, x = Math.round(Math.min(W * .45, 40)); x < W + 20; i++, x += 90 + Math.round(rnd(i) * 70)) cones.push({ x, crater: i ? crater + 3 + Math.round(rnd(i + 3) * 3) : crater, lava: i % 2 === 0 });
    const hills = [];
    for (let i = 0, x = 8; x < W; i++, x += 24 + Math.round(rnd(i + 60) * 20)) hills.push({ x, top: Math.round(H * (.55 + rnd(i + 80) * .12)) });
    mountains(px, W, base, hills, { snow: null, lit: ["#9a8a84", "#8b7b75", "#7d6e68"], shade: ["#76665f", "#6a5b55", "#5f514b"], streakL: "#a59690", streakS: "#55473f" });
    for (const c of cones) {
      for (let x = c.x - 30; x <= c.x + 30; x++) {
        const dx = Math.abs(x - c.x), top = dx <= 2 ? c.crater : c.crater + (dx - 2) + JIT[(x * 5 + 40) % JIT.length];
        for (let y = top; y < base; y++) {
          const f = (y - top) / Math.max(1, base - top), tone = f < .4 ? 0 : 1, lit = x <= c.x;
          px.set(x, y, (lit ? ["#7c6862", "#6a5853"] : ["#54453f", "#463a35"])[tone]);
        }
        if (dx <= 2) px.set(x, c.crater, c.lava ? (dx === 0 ? "#ffd27a" : "#ff8a1f") : "#3b302c");
      }
      if (c.lava) for (let k = 0; c.crater + 1 + k < base; k++) { const x = c.x + 2 + Math.floor(k * .55); px.set(x, c.crater + 1 + k, k % 3 === 0 ? "#ffb347" : "#ff6a00"); if (k % 2) px.set(x + 1, c.crater + 1 + k, "#c2410c"); }
    }
    const smoke = cones.filter(c => c.lava).map(c => `<circle cx="${c.x + 2}" cy="${c.crater - H * .12}" r="${H * .1}"/><circle cx="${c.x + 8}" cy="${c.crater - H * .24}" r="${H * .13}"/><circle cx="${c.x + 16}" cy="${c.crater - H * .3}" r="${H * .11}"/>`).join("");
    const glows = cones.filter(c => c.lava).map(c => `<circle cx="${c.x}" cy="${c.crater}" r="${H * .22}" fill="url(#${id}g)" opacity=".55"/>`).join("");
    return { W, H, body: `<defs>${lin(id + "s", [[0, "#e4d6cf"], [1, "#f8f0e8"]])}${glow(id + "g", "#ff9a3c")}<filter id="${id}b"><feGaussianBlur stdDeviation="${H * .05}"/></filter>${lin(id + "d", [[0, "#5b4a44"], [1, "#3b302c"]])}</defs>
      <rect width="${W}" height="${H}" fill="url(#${id}s)"/>
      <g filter="url(#${id}b)" fill="#b4a6a1" opacity=".75">${smoke}</g>${glows}
      <rect y="${base}" width="${W}" height="${H - base}" fill="url(#${id}d)"/>${pxLayer(px, W, H)}` };
  },
  aurora(W, H) {
    const id = "s" + (++uid), base = Math.round(H * .74), px = Px();
    for (let i = 0; i < Math.round(W * .5); i++) px.set(Math.floor(rnd(i) * W), Math.floor(rnd(i + 500) * H * .5), i % 3 ? "#a9b8d6" : "#eef4ff");
    const peaks = [];
    for (let i = 0, x = 6; x < W + 10; i++, x += 16 + Math.round(rnd(i + 7) * 16)) peaks.push({ x, top: Math.round(H * (.3 + rnd(i + 70) * .22)) });
    mountains(px, W, base, peaks, { snow: "#a9bdd8", snowS: "#7d91b0", lit: ["#26344f", "#1f2c45", "#1a263c"], shade: ["#18233a", "#141e33", "#111a2d"], streakL: "#2c3b58", streakS: "#0f1729" });
    const refl = reflect(px, base, H);
    const wave = (y, amp, step) => { let d = `M0 ${y}`; for (let x = 0; x < W + step; x += step) d += ` Q ${x + step / 2} ${y + (Math.floor(x / step) % 2 ? amp : -amp)} ${x + step} ${y}`; return d; };
    const band = (y, amp, op) => `<path d="${wave(y, amp, 24)}" stroke="url(#${id}a)" stroke-width="${H * .12}" fill="none" opacity="${op}"/>`;
    return { W, H, body: `<defs>${lin(id + "s", [[0, "#0b1324"], [1, "#1d2d48"]])}<linearGradient id="${id}a" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="72" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#5cf2b0"/><stop offset=".5" stop-color="#4cc3e0"/><stop offset="1" stop-color="#a07cf0"/></linearGradient>${lin(id + "l", [[0, "#122039"], [1, "#070d1a"]])}<filter id="${id}b"><feGaussianBlur stdDeviation="${H * .04}"/></filter></defs>
      <rect width="${W}" height="${H}" fill="url(#${id}s)"/>
      <g filter="url(#${id}b)">${band(H * .25, H * .1, .55)}${band(H * .38, H * .07, .35)}</g>
      <rect y="${base}" width="${W}" height="${H - base}" fill="url(#${id}l)"/>
      ${pxLayer(refl, W, H, 'opacity=".35"')}${pxLayer(px, W, H)}` };

function toBlocks(body) {
  const lines = body.split("\n"), out = [];
  for (let k = 0; k < lines.length; k++) {
    if (lines[k].startsWith("```")) {
      let j = k + 1;
      while (j < lines.length && !lines[j].startsWith("```")) j++;

}

    if (m.index > pos) out += `<span data-r="${base + pos}">${esc(text.slice(pos, m.index))}</span>`;
    if (m[1] !== undefined) out += `<code data-r="${base + m.index + 1}">${esc(m[1])}</code>`;
    else if (m[2] !== undefined) out += `<b data-r="${base + m.index + 2}">${esc(m[2])}</b>`;
    else out += `<a class="${notes[m[3]] ? "link" : "missing"}" data-open="${attr(m[3])}" data-r="${base + m.index + 2}">${esc(m[3])}</a>`;
    pos = m.index + m[0].length;

}

    return `<pre class="blk" data-i="${i}"><span data-r="${lines[0].length + 1}">${esc(inner)}</span></pre>`;
  }

const slash = { items: [], hi: 0 };
function updateSlash(ed) {

/* ===================== first sync + toast ===================== */
function firstSyncHtml() {
  const f = state.firstSync;
  if (!f) return "";
  const total = Object.keys(notes).length;
  const st = k => k < f.step ? "done" : k === f.step ? "active" : "";
  const icon = k => k < f.step ? "✓" : "";
  return `<div class="fs"><div class="fs-card">
    <div class="fs-art">${svgOf(scenes.glacier(96, 30))}</div>
    <div class="fs-body"><h3>Setting up Glacier</h3><p>First sync with <code>kabek/glacier-notes</code></p>
      <ol class="fs-steps">
        <li class="${st(1)}"><i>${icon(1)}</i><span>Connecting to GitHub</span><small></small></li>
        <li class="${st(2)}"><i>${icon(2)}</i><span>Downloading notes</span><small>${f.n} / ${total}</small>
          <div class="fs-bar"><b style="width:${Math.round(f.n / total * 100)}%"></b></div></li>
        <li class="${st(3)}"><i>${icon(3)}</i><span>Linking notes together</span><small></small></li>
        <li class="${st(4)}"><i>${icon(4)}</i><span>Ready to write</span><small></small></li>
      </ol></div></div></div>`;
}
const wait = ms => new Promise(r => setTimeout(r, ms));
async function runFirstSync() {
  const total = Object.keys(notes).length;
  state.sync = 1; state.firstSync = { step: 1, n: 0 }; renderAll();
  await wait(800); state.firstSync.step = 2; renderAll();
  for (let n = 1; n <= total; n++) { await wait(170); state.firstSync.n = n; renderAll(); }
  await wait(250); state.firstSync.step = 3; renderAll();
  await wait(650); state.firstSync.step = 4; renderAll();
  await wait(500); state.firstSync = null; state.sync = 0;
  showToast(`✓ All ${total} notes are here · synced just now`);
  open(state.current);
}
let toastTimer;
function showToast(msg) {
  state.toast = msg; renderAll();
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { state.toast = null; renderAll(); }, 3200);
}
async function syncNow() {
  state.sync = 1; renderAll();
  await wait(1100); state.sync = 0;
  showToast("✓ Up to date · nothing new on GitHub");
}

  const groups = [...courses().map(c => ({ key: c, label: shortCourse(c) })), { key: "concepts", label: "Concepts" }];
  const colors = ["#f0b98d", "#9fd4c4", "#c9b2e6", "#f4d98a", "#a9cbea"];
  const here = cur().type === "lesson" ? cur().course : "concepts", open = state.etab;
  let sheet = "";
  if (open) {
    const isSearch = open === "search", title = isSearch ? "Search" : open === "concepts" ? "Concepts" : open;
    const list = isSearch ? (searchOrHint() || `<div class="muted" style="padding:10px">Type to search all notes.</div>`)
      : `<div class="tree">${(open === "concepts" ? concepts() : lessonsOf(open)).map(t => `<a class="${t === state.current ? "cur" : ""}" data-open="${attr(t)}">${esc(t)}</a>`).join("")}</div>`;
    sheet = `<div class="e-sheet"><div class="bar"><b class="grow ellip">${esc(title)}</b><button class="btn" data-action="etab" data-val="">✕</button></div>
      ${isSearch ? `<div style="padding:8px"><input class="input" id="q" placeholder="Search all notes…" value="${attr(state.query)}"></div>` : ""}
      <div class="e-list">${list}</div>
      ${isSearch ? "" : `<div class="bar bottom"><button class="btn" data-action="${open === "concepts" ? "new-concept" : "new-lesson"}">+ New ${open === "concepts" ? "concept" : "lesson note"}</button></div>`}</div>`;
  }
  return `<div class="v e-wrap">
    <div class="e-main">
      <div class="bar"><div class="grow ellip"><b>${esc(state.current)}</b><br>${metaHtml()}</div>${syncHtml(true)}</div>
      ${bannerHtml()}
      <div class="sheet">${bodyHtml()}${backlinksLine()}</div>
    </div>
    <nav class="e-tabs">
      ${groups.map((g, i) => `<button class="e-tab ${open === g.key ? "on" : ""} ${here === g.key ? "here" : ""}" data-action="etab" data-val="${attr(g.key)}" style="--tab:${colors[i % colors.length]}" title="${attr(g.key)}"><span>${esc(g.label)}</span></button>`).join("")}
      <button class="e-tab e-search ${open === "search" ? "on" : ""}" data-action="etab" data-val="search" title="Search (Ctrl K)">${ICON.search}</button>
    </nav>
    ${sheet}
  </div>`;
}

// F — Home: a friendly start page with big cards; a note opens full-panel with "← Home".
function VariantF() {
  if (state.home) {
    const here = noteForPage(), hour = new Date().getHours();
    const hi = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
    const card = (t, sub) => `<a class="f-card" data-open="${attr(t)}"><b>${esc(t)}</b><small>${sub || (notes[t].type === "lesson" ? esc(shortCourse(notes[t].course)) : "Concept")} · ${snippet(t)}</small></a>`;
    const courseBlock = c => `<div class="f-course ${state.fcourse === c ? "open" : ""}">
        <button data-action="fcourse" data-val="${attr(c)}"><b>${esc(shortCourse(c))}</b><small>${lessonsOf(c).length} lesson notes</small><span>${state.fcourse === c ? "▾" : "▸"}</span></button>
        ${state.fcourse === c ? `<div class="tree">${lessonsOf(c).map(t => `<a data-open="${attr(t)}">${esc(t)}</a>`).join("")}</div>` : ""}</div>`;
    return `<div class="v"><div class="sheet f-home">
      <div class="f-hi">${hi}</div>
      <input class="input f-search" id="q" placeholder="Search your notes…   Ctrl K" value="${attr(state.query)}">
      ${state.query.trim() ? resultsHtml(state.query) : `
        <div class="f-h">On this page</div>
        ${here ? card(here, "Your note for this lesson") : `<button class="f-card f-new" data-action="new-lesson"><b>+ Start a note for “${esc(pages[state.page].title)}”</b><small>${esc(shortCourse(state.lastCourse))}</small></button>`}
        <div class="f-h">Continue writing</div>${recentNotes(3).map(t => card(t)).join("")}
        <div class="f-h">Courses</div>${courses().map(courseBlock).join("")}
        <div class="f-h">Concepts</div><div class="f-chips">${concepts().map(t => `<a data-open="${attr(t)}">${esc(t)}</a>`).join("")}<a class="add" data-action="new-concept">+ new concept</a></div>`}
    </div></div>`;
  }
  return `<div class="v">
    <div class="bar"><button class="btn f-back" data-action="home">← Home</button><div class="grow"></div>${syncHtml(true)}</div>
    ${bannerHtml()}
    <div class="sheet"><h1 class="title">${esc(state.current)}</h1><div class="meta" style="margin:-6px 0 var(--lh)">${metaHtml().replace(/<\/?span[^>]*>/g, "")}</div>${bodyHtml()}${backlinksLine()}</div>
  </div>`;
}

// G — Note tabs: notes you open stay as tabs on top, like browser tabs; + opens any note.
function VariantG() {
  if (!state.tabs.includes(state.current)) state.tabs.push(state.current);
  if (state.tabs.length > 6) state.tabs = state.tabs.slice(-6);
  const picker = state.gpicker ? `<div class="g-picker">
      <input class="input" id="q" placeholder="Open a note…" value="${attr(state.query)}">

      <div class="bar bottom"><button class="btn" data-action="new-lesson">+ Lesson note</button><span class="grow"></span><button class="btn" data-action="new-concept">+ Concept</button></div>
    </div>` : "";
  return `<div class="v">
    <div class="g-tabs">${state.tabs.map(t => `<div class="g-tab ${t === state.current ? "on" : ""}" data-open="${attr(t)}" title="${attr(t)}"><span>${esc(t)}</span><button class="g-x" data-close-tab="${attr(t)}" title="Close tab">×</button></div>`).join("")}
      <button class="g-add ${state.gpicker ? "on" : ""}" data-action="gpicker" title="Open a note (Ctrl K)">+</button></div>
    <div class="bar g-meta"><div class="grow ellip">${metaHtml()}</div>${syncHtml(true)}</div>

}

// J — Course path: your lessons as a path of stops on top, so you always see where you are in the course.
function VariantJ() {
  const n = cur();
  let path;
  if (n.type === "lesson") {
    const ls = lessonsOf(n.course), idx = ls.indexOf(state.current);
    path = `<div class="j-head"><b class="ellip">${esc(n.course)}</b><small>lesson ${idx + 1} of ${ls.length}</small></div>
      <div class="j-path">${ls.map(t => `<button class="j-stop ${t === state.current ? "on" : ""}" data-open="${attr(t)}" title="${attr(t)}"><i></i><span>${esc(t)}</span></button>`).join('<span class="j-line"></span>')}
        ${noteForPage() ? "" : `<span class="j-line dash"></span><button class="j-stop new" data-action="new-lesson" title="Start a note for this page"><i>+</i><span>this page</span></button>`}</div>`;
  } else {
    path = `<div class="j-head"><b>Concept</b><small>used in ${backlinks(state.current).length} notes</small></div>`;

    </div>

    ${bannerHtml()}

function paletteHtml() {
  if (!state.palette) return "";
  return `<div class="palette-wrap" data-action="palette-close"><div class="palette">
    <input class="input" id="pq" placeholder="Jump to a note, or type a new title…" value="${attr(state.query)}">
    ${state.query.trim() ? resultsHtml(state.query, true) : `<div class="results">${recentNotes(5).map((t, i) => `<a class="${i === state.hi ? "hi" : ""}" data-open="${attr(t)}">${esc(t)}<span class="snip">recent</span></a>`).join("")}</div>`}
  </div></div>`;
