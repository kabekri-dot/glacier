<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glacier</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <!-- Zen layout: only the page. The pill, menu and sync come in later slices. -->
    <main class="note" aria-label="Note"></main>
    <!-- Shown only when a save to this browser's copy fails (issue #25). -->
    <p class="save-error" role="alert" hidden>
      Couldn't save your last changes to this browser. Your text is still here —
      copy it somewhere safe.
    </p>
    <script type="module" src="panel.js"></script>
  </body>
</html>
