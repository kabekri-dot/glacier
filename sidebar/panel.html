<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glacier</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <!-- Zen layout: only the page, plus one pill on top that opens the menu. -->
    <div class="pill-bar">
      <button type="button" class="pill-side pill-back" aria-label="Your last notes" aria-haspopup="true" aria-expanded="false" title="Your last notes" hidden>&larr;</button>
      <div class="pill">
        <span class="pill-title" role="button" tabindex="0" title="Click to rename">Glacier</span>
        <span class="pill-archived" hidden>Archived</span>
        <!-- "1 of 3" when the page has more notes (#68); opens the ▾ menu. -->
        <button type="button" class="pill-count" title="Other notes for this page" hidden></button>
        <button type="button" class="pill-menu" aria-haspopup="true" aria-expanded="false" aria-label="Open the menu" title="Open the menu">&#9662;</button>
        <button type="button" class="pill-note-menu" aria-haspopup="true" aria-expanded="false" aria-label="Actions for this note" title="Actions for this note" hidden>&#8943;</button>
        <button type="button" class="sync-dot" aria-haspopup="true" aria-expanded="false" title="Saved in this browser"></button>
      </div>
      <button type="button" class="pill-side pill-new" aria-haspopup="true" aria-expanded="false" aria-label="New note">+</button>
    </div>
    <p class="rename-hint" role="status" hidden></p>
    <!-- Above the text of a note that is an original or a second version (#70, #80). -->
    <div class="second-version-bar" hidden></div>
    <div class="back-box" hidden></div>
    <div class="new-menu" hidden></div>
    <div class="note-menu" hidden></div>
    <div class="menu" hidden></div>
    <!-- Under the sync dot: the status, Sync now, notes with two versions (#75). -->
    <div class="sync-box" hidden></div>
    <!-- The note's Collection and Source, instead of its frontmatter (#13). -->
    <header class="note-meta" hidden></header>
    <main class="note" aria-label="Note"></main>
    <!-- Backlinks (#10): how many notes link here; a click lists them. -->
    <div class="backlinks-list" hidden></div>
    <button type="button" class="backlinks-button" aria-expanded="false" hidden></button>
    <!-- How many lines a copy put on the clipboard (#7), or how an Import went (#13). -->
    <p class="copied" role="status" hidden></p>
    <!-- Shown only when a save to this browser's copy fails (issue #25). -->
    <p class="save-error" role="alert" hidden>
      Couldn't save your last changes to this browser. Your text is still here.
      Copy it somewhere safe.
    </p>
    <!-- Settings (#18): the round glacier button opens them, beside the
         sidebar or inside it (#21). The button, the settings header and the
         toolbar share the glacier art (#19). settings-view.js draws settings
         and the Shortcuts panel (#20, tab in the pill bar). -->
    <button type="button" class="glacier-button" aria-label="Settings" title="Settings" aria-expanded="false" aria-controls="settings">
      <img src="../icons/glacier.svg" alt="" />
    </button>
    <script type="module" src="panel.js"></script>
  </body>
</html>
