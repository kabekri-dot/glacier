<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glacier</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <!-- Zen layout: only the page, plus one pill on top that opens the menu. -->
    <div class="pill-bar">
      <button type="button" class="pill-side pill-back" aria-label="Previous note" hidden>&larr;</button>
      <div class="pill">
        <span class="pill-title" role="button" tabindex="0" title="Click to rename">Glacier</span>
        <button type="button" class="pill-menu" aria-haspopup="true" aria-expanded="false" aria-label="Open the menu" title="Open the menu">&#9662;</button>
        <span class="sync-dot" title="Saved in this browser"></span>
      </div>
      <button type="button" class="pill-side pill-new" aria-haspopup="true" aria-expanded="false" aria-label="New note">+</button>
    </div>
    <p class="rename-hint" role="status" hidden></p>
    <div class="new-menu" hidden></div>
    <div class="menu" hidden></div>
    <!-- The note's Course and Source, instead of its frontmatter (#13). -->
    <header class="note-meta" hidden></header>
    <main class="note" aria-label="Note"></main>
    <!-- Backlinks (#10): how many notes link here; a click lists them. -->
    <div class="backlinks-list" hidden></div>
    <button type="button" class="backlinks-button" aria-expanded="false" hidden></button>
    <!-- How many lines a copy put on the clipboard (#7), or how an Import went (#13). -->
    <p class="copied" role="status" hidden></p>
    <!-- Shown only when a save to this browser's copy fails (issue #25). -->
    <p class="save-error" role="alert" hidden>
      Couldn't save your last changes to this browser. Your text is still here.
      Copy it somewhere safe.
    </p>
    <!-- Settings (#18): the round glacier button opens them inside the sidebar. -->
    <button type="button" class="glacier-button" aria-label="Settings" title="Settings" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
        <rect width="16" height="16" fill="#bfe0f7" />
        <rect y="10" width="16" height="6" fill="#3f78c4" />
        <path d="M2 10h12v-1h-1v-2h-1v-2h-1v-1h-1v-1h-2v1h-1v2h-1v1h-1v2h-1v1h-2z" fill="#f4fbff" />
        <path d="M8 3h1v1h1v1h1v2h1v2h1v1h-3v-2h-1v-3h-1z" fill="#9ccbee" />
        <rect x="3" y="12" width="3" height="1" fill="#9ccbee" />
        <rect x="9" y="14" width="4" height="1" fill="#9ccbee" />
      </svg>
    </button>
    <aside class="settings" id="settings" aria-label="Settings" hidden>
      <header class="settings-header">
        <h1 class="settings-title">Settings</h1>
        <button type="button" class="settings-close" aria-label="Close settings" title="Close settings">&times;</button>
      </header>
      <details class="settings-section" data-section="paper" open>
        <summary>Paper</summary>
        <div class="settings-body paper-body"></div>
      </details>
      <details class="settings-section" data-section="writing" open>
        <summary>Writing</summary>
        <div class="settings-body writing-body"></div>
      </details>
      <details class="settings-section" data-section="notes-repo">
        <summary>Notes repo</summary>
        <div class="settings-body repo-body"></div>
      </details>
    </aside>
    <script type="module" src="panel.js"></script>
  </body>
</html>
