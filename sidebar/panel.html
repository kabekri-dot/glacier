<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glacier</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <!-- Zen layout: only the page, and one bar on top (#121):
         ← Notes, the title with its pen, + and ⋯. -->
    <div class="pill-bar">
      <button type="button" class="pill-side pill-back" hidden>&larr;</button>
      <button type="button" class="pill-notes" aria-haspopup="true" aria-expanded="false" title="Your notes. Ctrl K"><img src="../art/icon-list.svg" alt="">Notes</button>
      <div class="pill">
        <!-- A small pixel lock before a secret note's title (#109). -->
        <img class="pill-lock" src="../art/icon-lock.svg" alt="" hidden>
        <!-- A click shows the note's headings; the pen renames. -->
        <span class="pill-title is-quiet" aria-haspopup="true" aria-expanded="false">Glacier</span>
        <button type="button" class="pill-pen" aria-label="Rename this note" title="Rename" hidden><img src="../art/icon-pencil.svg" alt=""></button>
        <span class="pill-archived" hidden>Archived</span>
        <!-- Only when sync needs you: a short word, a click opens the sync box. -->
        <button type="button" class="sync-word" aria-haspopup="true" aria-expanded="false" hidden></button>
      </div>
      <button type="button" class="pill-side pill-new" aria-haspopup="true" aria-expanded="false" aria-label="New note" title="New note">+</button>
      <button type="button" class="pill-side pill-note-menu" aria-haspopup="true" aria-expanded="false" aria-label="More for this note" title="More for this note" hidden>&#8943;</button>
    </div>
    <!-- Find in the open note (#111), drawn by find-view.js. -->
    <div class="find-box" hidden></div>
    <p class="rename-hint" role="status" hidden></p>
    <!-- Above the text of a note that is an original or a second version (#70, #80). -->
    <div class="second-version-bar" hidden></div>
    <div class="title-menu" hidden></div>
    <div class="new-menu" hidden></div>
    <div class="note-menu" hidden></div>
    <div class="menu" hidden></div>
    <!-- Under the sync word: the status, Sync now, notes with two versions (#75). -->
    <div class="sync-box" hidden></div>
    <!-- The pushpin in the top right corner of the paper (#122): faint, or
         stuck in when the note is pinned. -->
    <button type="button" class="pushpin" aria-pressed="false" hidden><img src="../art/icon-pin.svg" alt=""></button>
    <!-- Note details (#122), from ⋯: a drawer over the paper, and the dim
         layer beside it that closes it. -->
    <div class="details-veil" hidden></div>
    <aside class="note-details" role="dialog" aria-label="Note details" hidden></aside>
    <!-- The welcome on the first start, until Start writing (#85). -->
    <section class="welcome" aria-label="Welcome" hidden></section>
    <main class="note" aria-label="Note"></main>
    <!-- Backlinks (#10): how many notes link here; a click lists them. -->
    <div class="backlinks-list" hidden></div>
    <button type="button" class="backlinks-button" aria-expanded="false" hidden></button>
    <!-- How many lines a copy put on the clipboard (#7), or how an Import went (#13). -->
    <p class="copied" role="status" hidden></p>
    <!-- Shown only when a save to this browser's copy fails (issue #25), with
         its one fix, Copy note (#117). It goes again once a save works. -->
    <p class="save-error" role="alert" hidden>
      <span class="save-error-text"></span>
      <button type="button" class="notice-action save-error-copy">Copy note</button>
      <span class="save-error-copied" role="status" hidden>Copied.</span>
    </p>
    <!-- Settings (#18): the round glacier button opens them, beside the
         sidebar or inside it (#21). The button, the settings header and the
         toolbar share the glacier art (#19). settings-view.js draws settings
         and the Shortcuts panel (#20, opened from ⋯). -->
    <button type="button" class="glacier-button" aria-label="Settings" title="Settings" aria-expanded="false" aria-controls="settings">
      <img src="../icons/glacier.svg" alt="" />
    </button>
    <script type="module" src="panel.js"></script>
  </body>
</html>
