<!doctype html>
<!-- PROTOTYPE, throw away: three page turns to pick from (?variant=curl|lift|flip).
     Not part of Glacier. Open this file in Chrome and use the bar at the bottom. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page turn prototype</title>
<link rel="stylesheet" href="panel.css">
<style>
  body { overflow: hidden; }
  .stage { position: fixed; inset: 0 0 64px 0; overflow: hidden; perspective: 1400px; }
  .page {
    position: absolute; inset: 0;
    padding: 3.25rem 1.25rem 1rem;
    background:
      repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--line-height) - var(--rule-shift) - 1px), var(--rule) calc(var(--line-height) - var(--rule-shift) - 1px), var(--rule) calc(var(--line-height) - var(--rule-shift)), transparent calc(var(--line-height) - var(--rule-shift)), transparent var(--line-height)) 0 3.25rem / 100% var(--line-height),
      linear-gradient(var(--paper-top), var(--paper)) top / 100% 12rem no-repeat,
      var(--paper);
  }
  .page h1 { font-size: 1.5rem; margin: 0; line-height: calc(var(--line-height) * 2); }
  .page p { margin: 0; }
  .page .no { position: absolute; right: 1.25rem; top: 0.9rem; font-family: Montserrat, sans-serif; font-size: 0.8rem; opacity: 0.6; }
  .overlay { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .pixel-canvas { image-rendering: pixelated; inset: 0 auto auto 0; }
  .face { position: absolute; inset: 0; backface-visibility: hidden; }
  .back-face { transform: rotateX(180deg); background: var(--paper); }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 64px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: #1b2a4a; color: #eef4fb; font-family: Montserrat, sans-serif; font-size: 13px;
  }
  .bar button { font: inherit; color: inherit; background: transparent; border: 0; padding: 6px 8px; cursor: pointer; border-radius: 4px; }
  .bar button[aria-pressed="true"] { background: #3f78c4; }
  .bar .sep { width: 1px; height: 24px; background: #ffffff33; margin: 0 4px; }
  .bar .turn { font-size: 20px; padding: 2px 10px; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="bar">
  <button data-variant="curl">Curl</button>
  <button data-variant="pixel">Pixel curl</button>
  <button data-variant="lift">Lift</button>
  <button data-variant="flip">Notepad</button>
  <span class="sep"></span>
  <button class="turn" id="back" title="Page before">‹</button>
  <button class="turn" id="next" title="Next page">›</button>
  <span class="sep"></span>
  <button id="slow" aria-pressed="false">Slow</button>
</div>
<script src="page-turn-prototype.js"></script>
</body>
</html>
